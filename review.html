<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>口コミを投稿する</title>
<style>
  :root { --btn:#e60012; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif; background:#fff; color:#222; }
  .hero {
    min-height:420px; display:flex; align-items:center; justify-content:center; padding:48px 20px;
    background:
      radial-gradient(circle at 15% 20%, #cdeedd 0, transparent 45%),
      radial-gradient(circle at 85% 80%, #cfe6f7 0, transparent 50%),
      linear-gradient(135deg,#e9f7f1,#eaf3fb);
  }
  .box { max-width:560px; width:100%; }
  .thanks { font-size:14px; color:#555; margin:0 0 16px; }
  .title span { display:inline-block; background:#fff; font-size:clamp(24px,6vw,36px); font-weight:700; line-height:1.4; padding:4px 14px; margin-bottom:8px; }
  .title { margin:0 0 28px; }
  .btn {
    display:block; width:100%; padding:18px; text-align:center; text-decoration:none;
    background:var(--btn); color:#fff; font-weight:700; font-size:16px; border-radius:4px;
    box-shadow:0 3px 8px rgba(0,0,0,.2); transition:opacity .15s;
  }
  .btn:hover { opacity:.88; }
  .note { font-size:12px; color:#777; margin-top:14px; }
</style>
</head>
<body>
  <section class="hero">
    <div class="box">
      <p class="thanks">この度はアクセスありがとうございます</p>
      <h1 class="title">
        <span>Googleマップから</span><br>
        <span>クチコミの投稿を</span><br>
        <span>お願いいたします</span>
      </h1>
      <a class="btn" id="go" href="https://maps.app.goo.gl/Psrwhhv1R2cZLDV69" target="_blank" rel="noopener">Googleマップはこちら</a>
      <p class="note">Googleマップが開きます。「クチコミを書く」からご投稿ください。</p>
    </div>
  </section>
</body>
</html>
